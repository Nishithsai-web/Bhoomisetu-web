name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations and constraints
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhoomisetu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bhoomisetu
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations in order
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Constraint tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/core_constraints.sql

  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Bhoomisetu.slnx
      - run: dotnet build Bhoomisetu.slnx --no-restore -c Release
      - name: Tests (unit, architecture, integration)
        # xunit.v3 runs on Microsoft.Testing.Platform (opted in via global.json), which takes --solution.
        run: dotnet test --solution Bhoomisetu.slnx --no-build -c Release
        env:
          BHOOMISETU_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build
        env:
          BHOOMISETU_API_URL: http://localhost:5080
      - run: npm run typecheck
      # Production smoke test: the built server answers in every language and rejects unknown ones.
      - name: Smoke test the production server
        env:
          BHOOMISETU_API_URL: http://localhost:5080
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/en && break; sleep 1; done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3100$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check /en 200
          check /te 200
          check /hi 200
          check /te/units 200
          check /fr 404
          check /en/parcels/not-a-uuid/compare 404
          check / 307
